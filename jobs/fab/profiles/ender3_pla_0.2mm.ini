# Ender-3 V3 KE · PLA · 0.2mm — STARTER PrusaSlicer config.
# Good enough to slice + smoke-test the pipeline and for a first cautious print.
# REPLACE with your own GUI export (File > Export > Export Config) once you've
# dialed the printer in — see profiles/README.md. The V3 KE is DIRECT-DRIVE
# (short retraction) and runs Klipper.
printer_technology = FFF
bed_shape = 0x0,220x0,220x220,0x220
max_print_height = 250
nozzle_diameter = 0.4
gcode_flavor = klipper
z_offset = 0

filament_diameter = 1.75
filament_type = PLA
filament_density = 1.24
temperature = 200
first_layer_temperature = 205
bed_temperature = 60
first_layer_bed_temperature = 60

layer_height = 0.2
first_layer_height = 0.2
perimeters = 3
top_solid_layers = 4
bottom_solid_layers = 3
fill_density = 15%
fill_pattern = grid

perimeter_speed = 45
infill_speed = 60
travel_speed = 150
first_layer_speed = 20

retract_length = 0.8
retract_speed = 40
deretract_speed = 40

skirts = 1
skirt_distance = 2
fan_always_on = 1
min_fan_speed = 100
max_fan_speed = 100

start_gcode = G28\nG1 Z2 F3000\nG92 E0
end_gcode = M104 S0\nM140 S0\nG91\nG1 Z5 F3000\nG90\nG28 X\nM84
